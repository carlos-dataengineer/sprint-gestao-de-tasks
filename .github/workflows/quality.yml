name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run package tests
        run: python -m unittest discover -s sprint-skill/tests -v
      - name: Generate installation artifact
        run: python sprint-skill/scripts/install.py --output dist/Sprint.html
      - name: Verify generated artifact
        run: test -s dist/Sprint.html
